[workspace]
members = [
    "crates/muxtrix-app",
    "crates/muxtrix-control",
    "crates/muxtrix-domain",
    "crates/muxtrix-platform",
    "crates/muxtrix-sessions",
    "crates/muxtrix-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.71"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/Phoenixmatrix/muxtrix"

[workspace.dependencies]
# Only for the headless adapter probe (`gpu.rs`, `doctor`, `muxtrix-gpu-probe`);
# the window is drawn by GPUI, which carries its own copy at the same version.
wgpu = { version = "29.0.4", default-features = false, features = ["wgsl", "vulkan", "gles", "dx12", "metal"] }
pollster = "0.4"
async-channel = "2.5.0"
# GPUI predates its Linux wgpu renderer on crates.io, and Muxtrix needs the GL
# fallback for WSLg, so these come from git rather than a release.
#
# Deliberately no `rev` on the zed dependencies. `gpui-component` declares them
# with none either, and cargo treats two git specs as the same source only when
# their revision spec matches — pinning here while it does not produces *two*
# gpui crates in one graph, which fails to compile. A dependency's own
# Cargo.lock does not carry over to a dependent workspace, so the pin has to
# live in ours: the exact revisions are recorded in Cargo.lock, and
# `cargo update -p gpui` is how they move.
# `windows-manifest` is a gpui default. It shells out to a resource compiler
# with a path relative to gpui's own source directory, which native `rc.exe`
# resolves and `llvm-rc` (what cargo-xwin uses to cross-build from Linux) does
# not. It is off here so a Windows binary can be produced from this machine;
# a native Windows CI build should turn it back on, because the manifest is
# what makes the app DPI-aware.
gpui = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "5a5e2abc837b6d927e2b38e2097d2fbf39ebee77" }
fontdb = "0.23.0"
base64 = "0.22.1"
bytes = "1.10.1"
interprocess = "2.4.2"
libghostty-vt = "0.2.1"
portable-pty = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
png = "0.17.16"
serde_json = "1.0.143"
thiserror = "2.0.16"
toml_edit = "0.25.13"
ttf-parser = "0.25.1"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[patch.crates-io]
# The published 0.2.1 crate links the DLL import library on MSVC instead of the
# static archive. Keep its tested Ghostty source pin and apply only the upstream
# link correction until a fixed release is available.
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
