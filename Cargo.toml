[workspace]
members = [
    "crates/muxtrix-app",
    "crates/muxtrix-control",
    "crates/muxtrix-domain",
    # Phase 1 spike only; removed with the crate at the end of Phase 2.
    "crates/muxtrix-gpui-spike",
    "crates/muxtrix-platform",
    "crates/muxtrix-sessions",
    "crates/muxtrix-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.60"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/Phoenixmatrix/muxtrix"

[workspace.dependencies]
async-channel = "2.5.0"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "tokio", "wgpu", "svg"] }
# GPUI predates its Linux wgpu renderer on crates.io, and Muxtrix needs the GL
# fallback for WSLg, so these come from git rather than a release.
#
# Deliberately no `rev` on the zed dependencies. `gpui-component` declares them
# with none either, and cargo treats two git specs as the same source only when
# their revision spec matches — pinning here while it does not produces *two*
# gpui crates in one graph, which fails to compile. A dependency's own
# Cargo.lock does not carry over to a dependent workspace, so the pin has to
# live in ours: the exact revisions are recorded in Cargo.lock, and
# `cargo update -p gpui` is how they move.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "5a5e2abc837b6d927e2b38e2097d2fbf39ebee77" }
fontdb = "0.23.0"
base64 = "0.22.1"
bytes = "1.10.1"
interprocess = "2.4.2"
libghostty-vt = "0.2.1"
portable-pty = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
png = "0.17.16"
serde_json = "1.0.143"
thiserror = "2.0.16"
toml_edit = "0.25.13"
ttf-parser = "0.25.1"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[patch.crates-io]
# The published 0.2.1 crate links the DLL import library on MSVC instead of the
# static archive. Keep its tested Ghostty source pin and apply only the upstream
# link correction until a fixed release is available.
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
