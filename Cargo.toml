[workspace]
members = [
    "crates/muxtrix-app",
    "crates/muxtrix-control",
    "crates/muxtrix-domain",
    "crates/muxtrix-platform",
    "crates/muxtrix-sessions",
    "crates/muxtrix-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.54"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/Phoenixmatrix/muxtrix"

[workspace.dependencies]
async-channel = "2.5.0"
iced = { version = "0.14.0", features = ["advanced", "canvas", "tokio", "wgpu", "svg"] }
fontdb = "0.23.0"
base64 = "0.22.1"
interprocess = "2.4.2"
libghostty-vt = "0.2.1"
portable-pty = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
png = "0.17.16"
serde_json = "1.0.143"
thiserror = "2.0.16"
toml_edit = "0.25.13"
ttf-parser = "0.25.1"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[patch.crates-io]
# The published 0.2.1 crate links the DLL import library on MSVC instead of the
# static archive. Keep its tested Ghostty source pin and apply only the upstream
# link correction until a fixed release is available.
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
