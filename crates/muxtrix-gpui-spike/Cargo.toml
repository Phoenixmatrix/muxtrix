# Throwaway. Phase 1 of docs/GPUI_PORT_PLAN.md exists to answer one question
# before any application code is written: does GPUI render acceptably on every
# platform Muxtrix ships to? This crate is the smallest program that asks it.
# It is deleted at the end of Phase 2.
[package]
name = "muxtrix-gpui-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Platform spike: proves GPUI renders on every target before the port begins"

[dependencies]
# GPUI reports its adapter choice through `log`, and that choice is the whole
# point of the spike, so the spike needs a logger to see it.
env_logger = "0.11"
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true

[lints]
workspace = true
