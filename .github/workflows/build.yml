name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muxtrix-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.15.2

jobs:
  checks:
    name: Checks and headless E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux build and headless-rendering dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=30 300 \
              apt-get -o Acquire::Retries=0 update; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::apt-get update did not complete after 3 attempts"
              exit 1
            fi
            echo "apt-get update stalled (attempt ${attempt}/3); retrying"
          done
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            libzstd-dev \
            pkg-config \
            xauth \
            xvfb

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run unit and integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Linux headless application E2E
        run: cargo test -p muxtrix --features e2e --test headless_e2e --locked -- --test-threads=1

  build:
    name: Build ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 rather than a zig-pinned glibc: GPUI links the host's
          # libxkbcommon dynamically, and a library from a newer host cannot be
          # linked into a binary that promises an older glibc. Building on the
          # oldest supported release sets the floor (glibc 2.35) the honest way.
          - name: Linux x86_64
            runner: ubuntu-22.04
            artifact: muxtrix-linux-x86_64
          - name: Windows x86_64
            runner: windows-2025
            artifact: muxtrix-windows-x86_64
          - name: macOS arm64
            runner: macos-15
            artifact: muxtrix-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=30 300 \
              apt-get -o Acquire::Retries=0 update; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::apt-get update did not complete after 3 attempts"
              exit 1
            fi
            echo "apt-get update stalled (attempt ${attempt}/3); retrying"
          done
          sudo apt-get install --yes --no-install-recommends \
            desktop-file-utils \
            file \
            libfontconfig-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libzstd-dev \
            pkg-config
          cargo install cargo-deb --locked

      - name: Build portable Linux release binaries
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p muxtrix --bin muxtrix
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p muxtrix-control --bin muxtrixctl

      - name: Build native Windows release binaries
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p muxtrix --bin muxtrix
          cargo build --release --locked -p muxtrix-control --bin muxtrixctl

      - name: Build native macOS release binaries
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release --locked -p muxtrix --bin muxtrix
          cargo build --release --locked -p muxtrix-control --bin muxtrixctl

      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            archive="muxtrix-${version}-linux-x64.tar.gz"
            deb="muxtrix_${version}_amd64.deb"
          else
            archive="muxtrix-linux-x86_64.tar.gz"
            deb="muxtrix_continuous_amd64.deb"
          fi
          mkdir -p dist/package
          cp target/x86_64-unknown-linux-gnu/release/muxtrix dist/package/
          cp target/x86_64-unknown-linux-gnu/release/muxtrixctl dist/package/
          cp THIRD_PARTY_NOTICES.md dist/package/
          tar --create --gzip \
            --file "dist/${archive}" \
            --directory dist/package \
            muxtrix \
            muxtrixctl \
            THIRD_PARTY_NOTICES.md
          cargo deb \
            -p muxtrix \
            --target x86_64-unknown-linux-gnu \
            --no-build \
            --no-strip \
            --output "dist/${deb}"
          scripts/verify-deb-package.sh "dist/${deb}"
          rm -rf dist/package

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $Version = $env:GITHUB_REF_NAME.Substring(1)
            $Asset = "muxtrix-$Version-x64.zip"
          } else {
            $Asset = "muxtrix-windows-x86_64.zip"
          }
          ./.github/scripts/package-windows.ps1 `
            -MuxtrixPath target/release/muxtrix.exe `
            -ControlPath target/release/muxtrixctl.exe `
            -NoticesPath THIRD_PARTY_NOTICES.md `
            -OutputPath "dist/$Asset"

      - name: Sign and package macOS release
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            asset="muxtrix-${version}-macos-arm64.tar.gz"
          else
            asset="muxtrix-macos-arm64.tar.gz"
          fi
          codesign --force --sign - target/release/muxtrix target/release/muxtrixctl
          codesign --verify --verbose target/release/muxtrix
          codesign --verify --verbose target/release/muxtrixctl
          test "$(uname -m)" = arm64
          lipo target/release/muxtrix -verify_arch arm64
          lipo target/release/muxtrixctl -verify_arch arm64
          mkdir -p dist/package
          cp target/release/muxtrix target/release/muxtrixctl dist/package/
          cp THIRD_PARTY_NOTICES.md dist/package/
          COPYFILE_DISABLE=1 tar --create --gzip \
            --file "dist/${asset}" \
            --directory dist/package \
            muxtrix \
            muxtrixctl \
            THIRD_PARTY_NOTICES.md
          rm -rf dist/package

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  validate_homebrew:
    name: Validate Homebrew installation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source

      - name: Download macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: muxtrix-macos-arm64
          path: dist

      - name: Install and test the generated formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="muxtrix-${version}-macos-arm64.tar.gz"
          archive="${GITHUB_WORKSPACE}/dist/${asset}"
          hash="$(shasum -a 256 "${archive}" | cut -d ' ' -f 1)"
          tap="phoenixmatrix/muxtrix-validation"
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap-new "${tap}"
          formula="$(brew --repository "${tap}")/Formula/muxtrix.rb"
          source/scripts/render-homebrew-formula.sh \
            "${version}" \
            "file://${archive}" \
            "${hash}" \
            "${formula}"
          ruby -c "${formula}"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install "${tap}/muxtrix"
          HOMEBREW_NO_AUTO_UPDATE=1 brew test "${tap}/muxtrix"

  publish_continuous:
    name: Publish continuous release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: muxtrix-*
          path: dist
          merge-multiple: true

      - name: Validate and checksum continuous assets
        run: |
          set -euo pipefail
          test -f dist/muxtrix-linux-x86_64.tar.gz
          test -f dist/muxtrix-windows-x86_64.zip
          test -f dist/muxtrix-macos-arm64.tar.gz
          test -f dist/muxtrix_continuous_amd64.deb
          cd dist
          sha256sum \
            muxtrix-linux-x86_64.tar.gz \
            muxtrix-windows-x86_64.zip \
            muxtrix-macos-arm64.tar.gz \
            muxtrix_continuous_amd64.deb \
            > SHA256SUMS

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=continuous
          title="Muxtrix Continuous Build"
          notes="Automated development build from commit ${GITHUB_SHA}. Includes native Linux x64, Windows x64, and macOS arm64 binaries plus a Debian package. The macOS binaries are ad-hoc signed but not notarized; all other release binaries are unsigned."

          git tag --force "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi

  publish_tag:
    name: Publish versioned GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - validate_homebrew
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      windows_asset: ${{ steps.release.outputs.windows_asset }}
      linux_asset: ${{ steps.release.outputs.linux_asset }}
      macos_asset: ${{ steps.release.outputs.macos_asset }}
      deb_asset: ${{ steps.release.outputs.deb_asset }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust for release metadata validation
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: muxtrix-*
          path: dist
          merge-multiple: true

      - name: Validate tag and release assets
        id: release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH"
            exit 1
          fi

          cargo_version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "muxtrix") | .version')"
          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::Tag ${tag} does not match Cargo version ${cargo_version}"
            exit 1
          fi

          windows_asset="muxtrix-${version}-x64.zip"
          linux_asset="muxtrix-${version}-linux-x64.tar.gz"
          macos_asset="muxtrix-${version}-macos-arm64.tar.gz"
          deb_asset="muxtrix_${version}_amd64.deb"
          for asset in "${windows_asset}" "${linux_asset}" "${macos_asset}" "${deb_asset}"; do
            test -f "dist/${asset}"
          done

          windows_entries="$(unzip -Z1 "dist/${windows_asset}" | LC_ALL=C sort)"
          if [[ "${windows_entries}" != $'THIRD_PARTY_NOTICES.md\nmuxtrix.exe\nmuxtrixctl.exe' ]]; then
            echo "::error::Unexpected Windows archive contents"
            exit 1
          fi
          for archive in "${linux_asset}" "${macos_asset}"; do
            archive_entries="$(tar --list --gzip --file "dist/${archive}" \
              | sed 's#^\./##' \
              | grep -v '/$' \
              | LC_ALL=C sort)"
            if [[ "${archive_entries}" != $'THIRD_PARTY_NOTICES.md\nmuxtrix\nmuxtrixctl' ]]; then
              echo "::error::Unexpected contents in ${archive}"
              exit 1
            fi
          done
          test "$(dpkg-deb --field "dist/${deb_asset}" Version)" = "${version}-1"

          (
            cd dist
            sha256sum \
              "${windows_asset}" \
              "${linux_asset}" \
              "${macos_asset}" \
              "${deb_asset}" \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "windows_asset=${windows_asset}" >> "${GITHUB_OUTPUT}"
          echo "linux_asset=${linux_asset}" >> "${GITHUB_OUTPUT}"
          echo "macos_asset=${macos_asset}" >> "${GITHUB_OUTPUT}"
          echo "deb_asset=${deb_asset}" >> "${GITHUB_OUTPUT}"

      - name: Publish or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            mkdir existing-release
            gh release download "${TAG}" --dir existing-release
            (
              cd existing-release
              sha256sum --check --strict ../dist/SHA256SUMS
            )
            echo "Release ${TAG} already contains the expected immutable assets"
          else
            gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "Muxtrix ${VERSION}" \
              --notes "Muxtrix ${VERSION} for Linux x64, Windows x64, and macOS arm64. The macOS binaries are ad-hoc signed but not notarized; all other binaries are unsigned. Verify downloads against SHA256SUMS."
          fi

  validate_homebrew_release:
    name: Validate published Homebrew release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish_tag
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source

      - name: Download macOS package metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: muxtrix-macos-arm64
          path: dist

      - name: Fetch, install, and test through Homebrew
        env:
          TAG: ${{ needs.publish_tag.outputs.tag }}
          VERSION: ${{ needs.publish_tag.outputs.version }}
          MACOS_ASSET: ${{ needs.publish_tag.outputs.macos_asset }}
        run: |
          set -euo pipefail
          hash="$(shasum -a 256 "dist/${MACOS_ASSET}" | cut -d ' ' -f 1)"
          url="https://github.com/Phoenixmatrix/muxtrix/releases/download/${TAG}/${MACOS_ASSET}"
          tap="phoenixmatrix/muxtrix-validation"
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap-new "${tap}"
          formula="$(brew --repository "${tap}")/Formula/muxtrix.rb"
          source/scripts/render-homebrew-formula.sh \
            "${VERSION}" \
            "${url}" \
            "${hash}" \
            "${formula}"
          ruby -c "${formula}"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install "${tap}/muxtrix"
          HOMEBREW_NO_AUTO_UPDATE=1 brew test "${tap}/muxtrix"

  publish_scoop:
    name: Publish Scoop manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish_tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require the Scoop bucket token
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [[ -z "${SCOOP_BUCKET_TOKEN}" ]]; then
            echo "::error::SCOOP_BUCKET_TOKEN is required for tagged releases"
            exit 1
          fi

      - name: Check out Scoop bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Phoenixmatrix/scoop-muxtrix
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: muxtrix-windows-x86_64
          path: dist

      - name: Update and validate Scoop manifest
        env:
          TAG: ${{ needs.publish_tag.outputs.tag }}
          VERSION: ${{ needs.publish_tag.outputs.version }}
          WINDOWS_ASSET: ${{ needs.publish_tag.outputs.windows_asset }}
        run: |
          set -euo pipefail
          path="dist/${WINDOWS_ASSET}"
          hash="$(sha256sum "${path}" | cut -d ' ' -f 1)"
          url="https://github.com/Phoenixmatrix/muxtrix/releases/download/${TAG}/${WINDOWS_ASSET}"
          manifest="scoop-bucket/bucket/muxtrix.json"
          jq \
            --arg version "${VERSION}" \
            --arg url "${url}" \
            --arg hash "${hash}" \
            '.version = $version
             | .license = "MIT"
             | .architecture."64bit".url = $url
             | .architecture."64bit".hash = $hash' \
            "${manifest}" > "${manifest}.tmp"
          mv "${manifest}.tmp" "${manifest}"
          jq -e \
            --arg version "${VERSION}" \
            --arg url "${url}" \
            --arg hash "${hash}" \
            '.version == $version
             and .license == "MIT"
             and .architecture."64bit".url == $url
             and .architecture."64bit".hash == $hash' \
            "${manifest}" > /dev/null
          printf '%s  %s\n' "${hash}" "${path}" | sha256sum --check --strict

      - name: Commit Scoop manifest
        working-directory: scoop-bucket
        env:
          VERSION: ${{ needs.publish_tag.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/muxtrix.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Scoop manifest is already at ${VERSION}"
          else
            git commit -m "Update Muxtrix to ${VERSION}"
            git push origin HEAD:main
          fi

  publish_homebrew:
    name: Publish Homebrew formula
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish_tag
      - validate_homebrew_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require the Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for tagged releases"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source

      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Phoenixmatrix/homebrew-muxtrix
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: muxtrix-macos-arm64
          path: dist

      - name: Update and validate Homebrew formula
        env:
          TAG: ${{ needs.publish_tag.outputs.tag }}
          VERSION: ${{ needs.publish_tag.outputs.version }}
          MACOS_ASSET: ${{ needs.publish_tag.outputs.macos_asset }}
        run: |
          set -euo pipefail
          path="dist/${MACOS_ASSET}"
          hash="$(sha256sum "${path}" | cut -d ' ' -f 1)"
          url="https://github.com/Phoenixmatrix/muxtrix/releases/download/${TAG}/${MACOS_ASSET}"
          mkdir -p homebrew-tap/Formula
          source/scripts/render-homebrew-formula.sh \
            "${VERSION}" \
            "${url}" \
            "${hash}" \
            homebrew-tap/Formula/muxtrix.rb
          ruby -c homebrew-tap/Formula/muxtrix.rb
          grep --fixed-strings --line-regexp "  url \"${url}\"" homebrew-tap/Formula/muxtrix.rb
          grep --fixed-strings --line-regexp "  sha256 \"${hash}\"" homebrew-tap/Formula/muxtrix.rb

      - name: Commit Homebrew formula
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.publish_tag.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/muxtrix.rb
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Homebrew formula is already at ${VERSION}"
          else
            git commit -m "Update Muxtrix to ${VERSION}"
            git push origin HEAD:main
          fi

  publish_apt:
    name: Publish apt repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish_tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source

      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: muxtrix-linux-x86_64
          path: dist

      - name: Generate, verify, and publish apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_ASSET: ${{ needs.publish_tag.outputs.deb_asset }}
          VERSION: ${{ needs.publish_tag.outputs.version }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C source ls-remote --exit-code origin apt-repo > /dev/null 2>&1; then
            git clone --branch apt-repo --single-branch "${remote}" apt-repo
          else
            mkdir apt-repo
            git -C apt-repo init --initial-branch apt-repo
            git -C apt-repo remote add origin "${remote}"
          fi
          mkdir -p apt-repo/pool
          cp "dist/${DEB_ASSET}" apt-repo/pool/
          source/scripts/generate-apt-repository.sh apt-repo
          source/scripts/verify-apt-repository.sh apt-repo "${VERSION}"
          git -C apt-repo config user.name "github-actions[bot]"
          git -C apt-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C apt-repo add --all
          git -C apt-repo diff --cached --check
          if git -C apt-repo diff --cached --quiet; then
            echo "apt repository is already at ${VERSION}"
          else
            git -C apt-repo commit -m "Publish muxtrix ${VERSION} to the apt repository"
            git -C apt-repo push origin HEAD:apt-repo
          fi

          repository_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apt-repo"
          for attempt in 1 2 3 4 5 6; do
            if source/scripts/verify-apt-repository.sh "${repository_url}" "${VERSION}"; then
              exit 0
            fi
            echo "Public apt source has not refreshed yet (attempt ${attempt}/6)"
            sleep 10
          done
          echo "::error::Public apt source did not serve muxtrix ${VERSION}-1"
          exit 1
