name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muxtrix-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            artifact: muxtrix-linux-x86_64
            asset: muxtrix-linux-x86_64.tar.gz
          # Windows and macOS lanes are parked while Actions minutes are
          # exhausted — releases build locally via scripts/release.sh.
          # Re-enable by uncommenting; the steps below still support them.
          # - name: Windows x86_64
          #   runner: windows-latest
          #   artifact: muxtrix-windows-x86_64
          #   asset: muxtrix-windows-x86_64.zip
          # - name: macOS arm64
          #   runner: macos-latest
          #   artifact: muxtrix-macos-arm64
          #   asset: muxtrix-macos-arm64.tar.gz
          #   experimental: true

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux build and headless-rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            desktop-file-utils \
            file \
            pkg-config \
            xauth \
            xvfb

      - name: Install Linux release packaging tools
        # Parked with the release lanes; local releases package instead.
        if: false && runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-zigbuild --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run unit and integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Linux headless application E2E
        if: runner.os == 'Linux'
        run: cargo test -p muxtrix --features e2e --test headless_e2e --locked -- --test-threads=1

      - name: Build portable Linux release binaries
        # Parked with the release lanes; local releases package instead.
        if: false && runner.os == 'Linux'
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.34 -p muxtrix --bin muxtrix
          cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.34 -p muxtrix-control --bin muxtrixctl

      - name: Build native release binaries
        # Parked with the release lanes; local releases package instead.
        if: false && runner.os != 'Linux'
        run: |
          cargo build --release --locked -p muxtrix --bin muxtrix
          cargo build --release --locked -p muxtrix-control --bin muxtrixctl

      - name: Stage Linux binaries
        # Parked with the release lanes; local releases package instead.
        if: false
        id: package-linux
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            asset="muxtrix-${version}-linux-x64.tar.gz"
          else
            asset="${{ matrix.asset }}"
          fi
          mkdir -p dist/package
          cp target/x86_64-unknown-linux-gnu/release/muxtrix dist/package/
          cp target/x86_64-unknown-linux-gnu/release/muxtrixctl dist/package/
          cp THIRD_PARTY_NOTICES.md dist/package/
          tar --create --gzip \
            --file "dist/${asset}" \
            --directory dist/package \
            .
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            deb_asset="muxtrix_${version}_amd64.deb"
          else
            deb_asset="muxtrix_continuous_amd64.deb"
          fi
          cargo deb \
            -p muxtrix \
            --target x86_64-unknown-linux-gnu \
            --no-build \
            --no-strip \
            --output "dist/${deb_asset}"
          scripts/verify-deb-package.sh "dist/${deb_asset}"
          echo "release_asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "deb_asset=${deb_asset}" >> "${GITHUB_OUTPUT}"

      - name: Stage Windows binaries
        # Parked with the release lanes; local releases package instead.
        if: false
        id: package-windows
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $Version = $env:GITHUB_REF_NAME.Substring(1)
            $Asset = "muxtrix-$Version-x64.zip"
          } else {
            $Asset = "${{ matrix.asset }}"
          }
          ./.github/scripts/package-windows.ps1 `
            -MuxtrixPath target/release/muxtrix.exe `
            -ControlPath target/release/muxtrixctl.exe `
            -NoticesPath THIRD_PARTY_NOTICES.md `
            -OutputPath "dist/$Asset"
          "release_asset=$Asset" >> $env:GITHUB_OUTPUT

      - name: Stage macOS binaries
        # Parked with the release lanes; local releases package instead.
        if: false
        id: package-macos
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            asset="muxtrix-${version}-macos-arm64.tar.gz"
          else
            asset="${{ matrix.asset }}"
          fi
          mkdir -p dist/package
          cp target/release/muxtrix dist/package/
          cp target/release/muxtrixctl dist/package/
          cp THIRD_PARTY_NOTICES.md dist/package/
          tar --create --gzip \
            --file "dist/${asset}" \
            --directory dist/package \
            .
          echo "release_asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Upload Linux binaries
        # Parked with the release lanes; local releases package instead.
        if: false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ steps.package-linux.outputs.release_asset }}
            dist/${{ steps.package-linux.outputs.deb_asset }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows binaries
        # Parked with the release lanes; local releases package instead.
        if: false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ steps.package-windows.outputs.release_asset }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS binaries
        # Parked with the release lanes; local releases package instead.
        if: false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ steps.package-macos.outputs.release_asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish continuous release
    # Parked while Actions minutes are exhausted; scripts/release.sh
    # publishes from a developer machine instead.
    if: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download packaged binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: muxtrix-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          test -f dist/muxtrix-linux-x86_64.tar.gz
          test -f dist/muxtrix-windows-x86_64.zip
          test -f dist/muxtrix_continuous_amd64.deb
          cd dist
          ls muxtrix-* muxtrix_* | xargs sha256sum > SHA256SUMS

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=continuous
          title="Muxtrix Continuous Build"
          notes="Automated development build from commit ${GITHUB_SHA}. Includes native Linux, Windows x86_64, and macOS arm64 binaries plus a Debian package. These builds are unsigned."

          git tag --force "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi

  publish_tag:
    name: Publish versioned release and update Scoop
    # Parked while Actions minutes are exhausted; scripts/release.sh
    # publishes from a developer machine instead.
    if: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Require the private bucket token
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [[ -z "${SCOOP_BUCKET_TOKEN}" ]]; then
            echo "::error::SCOOP_BUCKET_TOKEN is required for versioned releases"
            exit 1
          fi

      - name: Check out application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          fetch-depth: 0

      - name: Check out private Scoop bucket
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Phoenixmatrix/scoop-muxtrix
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Install Rust for release metadata validation
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Download packaged binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: muxtrix-*
          path: dist
          merge-multiple: true

      - name: Validate tag, package, and manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH"
            exit 1
          fi

          cargo_version="$(cargo metadata \
            --manifest-path source/Cargo.toml \
            --format-version 1 \
            --no-deps \
            | jq -r '.packages[] | select(.name == "muxtrix") | .version')"
          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::Tag ${tag} does not match Cargo version ${cargo_version}"
            exit 1
          fi

          windows_asset="muxtrix-${version}-x64.zip"
          linux_asset="muxtrix-${version}-linux-x64.tar.gz"
          macos_asset="muxtrix-${version}-macos-arm64.tar.gz"
          deb_asset="muxtrix_${version}_amd64.deb"
          windows_path="dist/${windows_asset}"
          linux_path="dist/${linux_asset}"
          test -f "${windows_path}"
          test -f "${linux_path}"
          test -f "dist/${deb_asset}"
          if [[ ! -f "dist/${macos_asset}" ]]; then
            echo "::warning::macOS asset missing; publishing without it"
            macos_asset=""
          fi

          archive_entries="$(unzip -Z1 "${windows_path}" | LC_ALL=C sort)"
          if [[ "${archive_entries}" != $'THIRD_PARTY_NOTICES.md\nmuxtrix.exe\nmuxtrixctl.exe' ]]; then
            echo "::error::Windows archive must contain the two executables and third-party notice file at its root"
            exit 1
          fi

          hash="$(sha256sum "${windows_path}" | cut -d ' ' -f 1)"
          url="https://github.com/Phoenixmatrix/muxtrix/releases/download/${tag}/${windows_asset}"
          manifest="scoop-bucket/bucket/muxtrix.json"
          jq \
            --arg version "${version}" \
            --arg url "${url}" \
            --arg hash "${hash}" \
            '.version = $version
             | .architecture."64bit".url = $url
             | .architecture."64bit".hash = $hash' \
            "${manifest}" > "${manifest}.tmp"
          mv "${manifest}.tmp" "${manifest}"

          jq -e \
            --arg version "${version}" \
            --arg url "${url}" \
            --arg hash "${hash}" \
            '.version == $version
             and .architecture."64bit".url == $url
             and .architecture."64bit".hash == $hash' \
            "${manifest}" > /dev/null
          manifest_hash="$(jq -r '.architecture."64bit".hash' "${manifest}")"
          printf '%s  %s\n' "${manifest_hash}" "${windows_path}" | sha256sum --check --strict

          (
            cd dist
            sha256sum "${windows_asset}" "${linux_asset}" ${macos_asset:+"${macos_asset}"} "${deb_asset}" > SHA256SUMS
          )
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "windows_asset=${windows_asset}" >> "${GITHUB_OUTPUT}"
          echo "linux_asset=${linux_asset}" >> "${GITHUB_OUTPUT}"
          echo "macos_asset=${macos_asset}" >> "${GITHUB_OUTPUT}"
          echo "deb_asset=${deb_asset}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable private release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          WINDOWS_ASSET: ${{ steps.release.outputs.windows_asset }}
          LINUX_ASSET: ${{ steps.release.outputs.linux_asset }}
          MACOS_ASSET: ${{ steps.release.outputs.macos_asset }}
          DEB_ASSET: ${{ steps.release.outputs.deb_asset }}
        run: |
          if gh release view "${TAG}" --repo Phoenixmatrix/muxtrix > /dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists; versioned assets are immutable"
            exit 1
          fi
          assets=("dist/${WINDOWS_ASSET}" "dist/${LINUX_ASSET}" "dist/${DEB_ASSET}")
          if [[ -n "${MACOS_ASSET}" && -f "dist/${MACOS_ASSET}" ]]; then
            assets+=("dist/${MACOS_ASSET}")
          fi
          gh release create "${TAG}" "${assets[@]}" \
            dist/SHA256SUMS \
            --repo Phoenixmatrix/muxtrix \
            --verify-tag \
            --title "Muxtrix ${VERSION}" \
              --notes "Muxtrix ${VERSION} for Windows x64 and Linux x64. These builds are unsigned; verify them against SHA256SUMS."

      - name: Commit private Scoop manifest
        working-directory: scoop-bucket
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/muxtrix.json
          git diff --cached --check
          git commit -m "Update Muxtrix to ${VERSION}"
          git push origin HEAD:main

      - name: Publish flat apt repository branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_ASSET: ${{ steps.release.outputs.deb_asset }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg-dev apt-utils
          if git -C source ls-remote --exit-code origin apt-repo > /dev/null 2>&1; then
            git clone --branch apt-repo --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apt-repo
          else
            mkdir apt-repo
            git -C apt-repo init --initial-branch apt-repo
            git -C apt-repo remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          mkdir -p apt-repo/pool
          cp "dist/${DEB_ASSET}" apt-repo/pool/
          source/scripts/generate-apt-repository.sh apt-repo
          source/scripts/verify-apt-repository.sh apt-repo "${VERSION}"
          git -C apt-repo config user.name "github-actions[bot]"
          git -C apt-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C apt-repo add --all
          git -C apt-repo commit -m "Publish muxtrix ${VERSION} to the apt repository"
          git -C apt-repo push origin HEAD:apt-repo
